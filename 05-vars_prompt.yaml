-name: variables from prompt
  hosts: localhost
  become: yes
  vars_prompt:
  - name: username
    prompt: plz enter your name:
    private: false
  - name: password
    prompt: plz enter your password
    private: true
  tasks:
  - name: print variables values
    ansible.builtin.debug:
      msg: "USERNAME:{{username}}, PASSWORD:{{password}}"
  
  
  